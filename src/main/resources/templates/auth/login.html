<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Sistema de Vendas</title>
    <style>
        :root {
            --bg: #0b0f1a;
            --card: #121829;
            --card-border: #222b45;
            --text: #e8ecf5;
            --muted: #8b95b0;
            --input-bg: #0d1322;
            --input-border: #2a3454;
            --accent: #6366f1;
            --accent-2: #8b5cf6;
            --danger-bg: rgba(239, 68, 68, .12);
            --danger-border: rgba(239, 68, 68, .4);
            --danger-text: #fca5a5;
            --ok-bg: rgba(34, 197, 94, .12);
            --ok-border: rgba(34, 197, 94, .4);
            --ok-text: #86efac;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 500px at 15% 10%, rgba(99, 102, 241, .22), transparent 60%),
                radial-gradient(800px 500px at 90% 90%, rgba(139, 92, 246, .18), transparent 60%),
                var(--bg);
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 40px 34px 34px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
        }

        .logo {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 26px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 24px rgba(99, 102, 241, .45);
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -.3px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: .95rem;
            margin: 6px 0 26px;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: .9rem;
            margin-bottom: 20px;
            border: 1px solid;
        }
        .alert-error { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
        .alert-ok    { background: var(--ok-bg);     border-color: var(--ok-border)};
