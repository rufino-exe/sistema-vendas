<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Vendas</title>
    <link th:href="@{/static/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 50px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .alert {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 12px;
        }
        
        .csrf-hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 Sistema de Vendas</h1>
            <p>Faça login para continuar</p>
        </div>
        
        <!-- Alerta de erro -->
        <div th:if="${param.error}" class="alert alert-danger">
            <strong>Erro:</strong> Email ou senha inválidos. Tente novamente.
        </div>
        
        <!-- Alerta de logout -->
        <div th:if="${param.logout}" class="alert alert-info">
            <strong>Sucesso:</strong> Você foi desconectado com segurança.
        </div>
        
        <!-- Alerta de sessão expirada -->
        <div th:if="${param.expired}" class="alert alert-danger">
            <strong>Sessão Expirada:</strong> Faça login novamente.
        </div>
        
        <!-- Formulário de login -->
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">📧 Email:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="seu-email@exemplo.com"
                    required
                    autofocus>
            </div>
            
            <div class="form-group">
                <label for="senha">🔑 Senha:</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha" 
                    placeholder="sua senha"
                    required>
            </div>
            
            <!-- Token CSRF (automático com Thymeleaf) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            
            <button type="submit" class="btn-login">
                Entrar
            </button>
        </form>
        
        <div class="login-footer">
            <p>
                Credenciais de teste:<br>
                Email: <code style="background: #f0f0f0; padding: 2px 5px;">admin@sistemavenda.com</code><br>
                (Crie usuários no banco de dados)
            </p>
        </div>
    </div>
    
    <script th:src="@{/static/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
